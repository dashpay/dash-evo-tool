name: Backend E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "v*-dev"
    paths:
      - "tests/backend-e2e/**"
      - "src/backend_task/**"
      - "src/context/**"
      - "src/model/wallet/**"
      - "src/spv/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/backend-e2e.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tests/backend-e2e/**"
      - "src/backend_task/**"
      - "src/context/**"
      - "src/model/wallet/**"
      - "src/spv/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/backend-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-e2e:
    name: Backend E2E
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-x86_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Run backend E2E tests
        run: scripts/safe-cargo.sh test --test backend-e2e --all-features -- --ignored --nocapture --test-threads=1
        env:
          E2E_WALLET_MNEMONIC: ${{ secrets.E2E_WALLET_MNEMONIC }}
