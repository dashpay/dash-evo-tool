---
name: "Claude review (label: claudius-review)"

"on":
  pull_request:
    types: [labeled, synchronize]

jobs:
  review:
    if: >
      github.event.pull_request.draft == false &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'claudius-review') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claudius-review'))
      )
    # Job-level: runs skipped by `if:` (e.g. unrelated label events) never join
    # the group, so they can't cancel an in-flight review; a new push to a
    # labeled PR still supersedes it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
      CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
    steps:
      # Post the review as claudbot[bot] (GitHub App, no contents write).
      # The private key only reaches create-github-app-token; the review
      # action gets a 1h token scoped to this repo. Never put the key in
      # job-level env: the review agent's step would see it. Keep this the
      # first step: the token must outlive timeout-minutes (60). Without the
      # CLAUDBOT_CLIENT_ID variable the review falls back to GITHUB_TOKEN.
      - name: Create claudbot token
        id: app-token
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK != '' && vars.CLAUDBOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.CLAUDBOT_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDBOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Claudius Review
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK != '' }}
        uses: lklimek/claudius-review-action@main
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          memcan_url: ${{ vars.MEMCAN_URL }}
          memcan_api_key: ${{ secrets.MEMCAN_API_KEY }}
          claude_extra_args: "--permission-mode auto"
          # Claudius-Maginificent only has triage access to this repo (no git
          # push), so the collaborator-permission API reports it as "read" —
          # below claude-code-action's admin/write bar. It's a trusted bot
          # that only ever applies the trigger label, so allow-list it by
          # name instead of granting real write access.
          allowed_non_write_users: Claudius-Maginificent
