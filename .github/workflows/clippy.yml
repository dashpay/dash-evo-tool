name: Clippy

# Pushes keep path filters; PRs report required checks even for docs-only changes.
on:
  push:
    branches:
      - "v*-dev"
    # Mirrors scripts/ci/pr_scope.py: only documentation skips the suite.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Allows a manual run against a branch. Draft PRs are suppressed by the
  # `draft != true` guard below and otherwise have no way to run CI at all; a
  # manual run covers them. Note it tests the branch head, not the PR merge
  # commit, so it does not prove the merged result is green.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Determine PR scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci/pr_scope.py --suite clippy

  clippy:
    needs: [scope]
    name: Clippy
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.needed != 'false') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # No `toolchain` or `components` input: the action installs the channel and
      # the components rust-toolchain.toml pins, so a bump there is linted by the
      # compiler it introduces. Naming a version here would duplicate that pin
      # and silently keep linting the old compiler after the file moved on.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # This action defaults RUSTFLAGS to "-D warnings". The Clippy step
          # already passes `-D warnings` itself, and setting it globally would
          # also deny warnings for the fmt check's build — keep it unset.
          rustflags: ""
          # Cargo caching is handled by the actions/cache step above.
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-x86_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  # Same tool and version as dashpay/platform's "Find unused dependencies"
  # step. Pinned release binary with a checksum: no compile, no Rust toolchain.
  machete:
    name: Unused dependencies
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_MACHETE_VERSION: "0.9.2"
      CARGO_MACHETE_SHA256: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-machete
        run: |
          name="cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/cargo-machete"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$name.tar.gz" \
            "https://github.com/bnjbvr/cargo-machete/releases/download/v${CARGO_MACHETE_VERSION}/$name.tar.gz"
          echo "${CARGO_MACHETE_SHA256}  $dir/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
          echo "$dir/$name" >> "$GITHUB_PATH"

      - name: Find unused dependencies
        run: |
          test "$(cargo-machete --version)" = "$CARGO_MACHETE_VERSION"
          cargo-machete
