name: Build Flatpak

on:
  push:
    branches:
      - "**flatpak**"
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Sync metainfo version from Cargo.toml
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "dash-evo-tool") | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from Cargo.toml"
            exit 1
          fi
          # Use tag date for releases, current date for manual/PR builds
          if [ "${{ github.ref_type }}" = "tag" ]; then
            DATE=$(git log -1 --format=%cs "${{ github.ref }}")
          else
            DATE=$(date +%Y-%m-%d)
          fi
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${VERSION}\" date=\"${DATE}\"|" \
            flatpak/org.dash.DashEvoTool.metainfo.xml
          # Verify replacement applied
          if ! grep -q "version=\"${VERSION}\"" flatpak/org.dash.DashEvoTool.metainfo.xml; then
            echo "::error::Failed to update metainfo.xml with version ${VERSION}"
            exit 1
          fi
          echo "Metainfo version set to ${VERSION}, date ${DATE}"

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK and runtime
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08
          echo "=== Disk space after SDK install ==="
          df -h

      - name: Prepare Cargo cache
        run: mkdir -p cargo-cache/registry cargo-cache/git cargo-target

      - name: Restore Cargo cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            cargo-cache
            cargo-target
          key: cargo-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-flatpak-${{ matrix.arch }}-

      - name: Bind-mount Cargo cache into Flatpak sandbox
        run: |
          WORKSPACE="$(pwd)"
          sed -i "/^  build-args:$/,/--share=network/{
            /--share=network/a\\
              - --bind-mount=/run/build/dash-evo-tool/cargo=${WORKSPACE}/cargo-cache\\
              - --bind-mount=/run/build/dash-evo-tool/target=${WORKSPACE}/cargo-target
          }" flatpak/org.dash.DashEvoTool.yml

      - name: Cache Flatpak builder
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/org.dash.DashEvoTool.yml', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=flatpak-repo build-dir flatpak/org.dash.DashEvoTool.yml


      - name: Verify Flatpak binary dependencies
        run: |
          BINARY="build-dir/files/bin/dash-evo-tool"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Binary not found at $BINARY"
            exit 1
          fi
          echo "Checking shared library dependencies inside Flatpak sandbox..."
          # Run ldd inside the Flatpak build environment so libraries resolve
          # against the Flatpak runtime (/usr) and app (/app), not the host.
          DEPS=$(flatpak build build-dir ldd /app/bin/dash-evo-tool 2>&1 || true)
          echo "$DEPS"
          # Fail on missing libraries (not found = will crash at runtime)
          if echo "$DEPS" | grep -q "not found"; then
            echo "::error::Binary has missing shared library dependencies"
            echo "$DEPS" | grep "not found"
            exit 1
          fi
          echo "✅ Flatpak binary dependencies look clean"

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo dash-evo-tool-linux-${{ matrix.arch }}.flatpak org.dash.DashEvoTool

      - name: Clean Cargo cache for storage
        run: |
          rm -rf cargo-target/release/incremental
          rm -rf cargo-cache/registry/src
          echo "=== Cargo cache sizes ==="
          du -sh cargo-cache cargo-target || true

      - name: Save Cargo cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            cargo-cache
            cargo-target
          key: cargo-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dash-evo-tool-linux-${{ matrix.arch }}-flatpak
          path: dash-evo-tool-linux-${{ matrix.arch }}.flatpak
          retention-days: 14

      - name: Attach bundle to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dash-evo-tool-linux-${{ matrix.arch }}.flatpak
