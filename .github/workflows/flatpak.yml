name: Build Flatpak

on:
  push:
    branches:
      - "**flatpak**"
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:
    inputs:
      version_override:
        description: "Override the Cargo.toml package version for this build only (never committed)"
        required: false
        type: string
        default: ""

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}
    # Sized for a COLD build, not a cache hit. The Cargo cache key below is
    # keyed on `Cargo.lock`, so every dependency bump starts both arches from
    # a prefix-restore that still recompiles the whole upstream tree: ~16
    # minutes of `cargo build --release` on x86_64 before flatpak-builder even
    # starts exporting. A warm run finishes in well under half this budget;
    # the headroom exists so the cold run can reach "Save Cargo cache" and
    # make the next one warm.
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Resolve version override
        id: vsel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_OVERRIDE_INPUT: ${{ inputs.version_override }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ov="$VERSION_OVERRIDE_INPUT"
          if [ -z "$ov" ] && [ "${{ github.event_name }}" = "release" ]; then
            tag="$EVENT_RELEASE_TAG"
            # Recover the original version_override from the release notes marker
            # `finalize` (weekly-build.yml) writes at creation time. This works for
            # ANY accepted version shape (not just the canonical vX.Y.Z-weekly.YYYYMMDD
            # pattern), so a custom `version` dispatch input survives undrafting too.
            body=$(gh release view "$tag" --json body --jq .body -R "$GITHUB_REPOSITORY")
            marker=$(printf '%s' "$body" | grep -oE '<!-- weekly-version: [^ ]+ -->' | sed -E 's/<!-- weekly-version: (.+) -->/\1/' || true)
            if [ -n "$marker" ]; then
              ov="$marker"
            elif printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-weekly\.[0-9]{8}$'; then
              # Fallback for releases created before the marker existed.
              ov="${tag#v}+$(git rev-parse --short=9 HEAD)"
            fi
          fi
          echo "override=$ov" >> "$GITHUB_OUTPUT"

      - name: Apply version override
        if: steps.vsel.outputs.override != ''
        uses: ./.github/actions/apply-version-override
        with:
          version: ${{ steps.vsel.outputs.override }}

      - name: Install Rust toolchain (for cargo metadata)
        uses: dtolnay/rust-toolchain@stable

      - name: Sync metainfo version from Cargo.toml
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "dash-evo-tool") | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from Cargo.toml"
            exit 1
          fi
          # Use release published date when available, tag commit date for tag pushes, current date otherwise
          if [ -n "${{ github.event.release.published_at }}" ]; then
            DATE=$(echo "${{ github.event.release.published_at }}" | cut -dT -f1)
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            DATE=$(git log -1 --format=%cs "${{ github.ref }}")
          else
            DATE=$(date +%Y-%m-%d)
          fi
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${VERSION}\" date=\"${DATE}\"|" \
            flatpak/org.dash.DashEvoTool.metainfo.xml
          # Verify replacement applied
          if ! grep -q "version=\"${VERSION}\" date=\"${DATE}\"" flatpak/org.dash.DashEvoTool.metainfo.xml; then
            echo "::error::Failed to update metainfo.xml with version ${VERSION} and date ${DATE}"
            exit 1
          fi
          echo "Metainfo version set to ${VERSION}, date ${DATE}"

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK and runtime
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08
          echo "=== Disk space after SDK install ==="
          df -h

      - name: Prepare Cargo cache
        run: mkdir -p cargo-cache/registry cargo-cache/git cargo-target

      - name: Restore Cargo cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            cargo-cache
            cargo-target
          key: cargo-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          # Ordered most to least specific. The middle entry is what makes a
          # partial save useful: an incomplete build saves under a run-suffixed
          # key (see "Save Cargo cache"), and this prefix picks up the most
          # recent one for THIS lockfile ahead of a complete cache built from a
          # different, older lockfile.
          restore-keys: |
            cargo-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-
            cargo-flatpak-${{ matrix.arch }}-

      - name: Bind-mount Cargo cache into Flatpak sandbox
        run: |
          WORKSPACE="$(pwd)"
          sed -i "/^  build-args:$/,/--share=network/{
            /--share=network/a\\
              - --bind-mount=/run/build/dash-evo-tool/cargo=${WORKSPACE}/cargo-cache\\
              - --bind-mount=/run/build/dash-evo-tool/target=${WORKSPACE}/cargo-target
          }" flatpak/org.dash.DashEvoTool.yml

      - name: Cache Flatpak builder
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/org.dash.DashEvoTool.yml', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=flatpak-repo build-dir flatpak/org.dash.DashEvoTool.yml


      - name: Verify Flatpak binary dependencies
        run: |
          BINARY="build-dir/files/bin/dash-evo-tool"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Binary not found at $BINARY"
            exit 1
          fi
          echo "Checking shared library dependencies inside Flatpak sandbox..."
          # Run ldd inside the Flatpak build environment so libraries resolve
          # against the Flatpak runtime (/usr) and app (/app), not the host.
          DEPS=$(flatpak build build-dir ldd /app/bin/dash-evo-tool 2>&1 || true)
          echo "$DEPS"
          # Fail on missing libraries (not found = will crash at runtime)
          if echo "$DEPS" | grep -q "not found"; then
            echo "::error::Binary has missing shared library dependencies"
            echo "$DEPS" | grep "not found"
            exit 1
          fi
          echo "✅ Flatpak binary dependencies look clean"

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo dash-evo-tool-linux-${{ matrix.arch }}.flatpak org.dash.DashEvoTool

      # These run after the build, so on a failed or timed-out job they are
      # reached only if the runner gets that far. The timeout above is what
      # primarily guarantees a cold build reaches them; `always()` is
      # defence-in-depth, and it is unconditionally effective for an ordinary
      # step failure (a compile error, a failed dependency check) where the
      # partial `cargo-target` is still worth keeping. On a cancellation the
      # runner continues into its cleanup phase, so the save often lands, but
      # a multi-gigabyte upload can be cut short by the cancellation grace
      # period — treat it as opportunistic, never as a guarantee.
      - name: Clean Cargo cache for storage
        if: always()
        run: |
          rm -rf cargo-target/release/incremental
          rm -rf cargo-cache/registry/src
          echo "=== Cargo cache sizes ==="
          du -sh cargo-cache cargo-target || true

      # Cache entries are IMMUTABLE. Saving an incomplete build under the
      # canonical key would freeze it: every later run would restore that
      # partial archive, rebuild the remainder, and be unable to replace it —
      # permanently paying for whatever the first bad run failed to compile.
      # So only a fully successful job claims the canonical key; anything else
      # saves under a run-suffixed key that the middle `restore-keys` prefix
      # above picks up, letting each attempt improve on the last until one
      # succeeds and writes the real thing.
      #
      # `continue-on-error` because saving is best-effort: re-running a job
      # whose key already exists makes the save a no-op, and that must never
      # turn a green build red.
      - name: Save Cargo cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            cargo-cache
            cargo-target
          key: cargo-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}${{ job.status == 'success' && '' || format('-partial-{0}-{1}', github.run_id, github.run_attempt) }}

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dash-evo-tool-linux-${{ matrix.arch }}-flatpak
          path: dash-evo-tool-linux-${{ matrix.arch }}.flatpak
          retention-days: 14

      - name: Attach bundle to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dash-evo-tool-linux-${{ matrix.arch }}.flatpak
