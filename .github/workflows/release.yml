name: Release Dash Evo Tool

on:
  push:
    tags:
      - 'v*'
      - 'v*-dev.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Version (i.e. v0.1.0)"
        required: true

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build-and-release:
    name: Build and Release Dash Evo Tool
    strategy:
      matrix:
        include:
          - name: "linux-x86_64"
            runs-on: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            platform: "x86_64-linux"
          - name: "linux-arm64"
            runs-on: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-gnu"
            platform: "arm64-linux"
          - name: "Windows"
            runs-on: "ubuntu-22.04"
            target: "x86_64-pc-windows-gnu"
            platform: "windows"
            ext: ".exe"

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-


      - name: Setup prerequisites
        run: |
          mkdir -p dash-evo-tool/

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install essentials
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config clang cmake unzip libsqlite3-dev gcc-mingw-w64 mingw-w64 libsqlite3-dev mingw-w64-x86-64-dev gcc-aarch64-linux-gnu zip && uname -a && cargo clean

      - name: Install protoc (ARM)
        if: ${{ matrix.platform == 'arm64-linux' }}
        run: curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-aarch_64.zip && sudo unzip -o protoc-25.2-linux-aarch_64.zip -d /usr/local bin/protoc && sudo unzip -o protoc-25.2-linux-aarch_64.zip -d /usr/local 'include/*' && rm -f protoc-25.2-linux-aarch_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Install protoc (AMD)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip && sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc && sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*' && rm -f protoc-25.2-linux-x86_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Install protoc (Windows)
        if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
        run: curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip && sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc && sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*' && rm -f protoc-25.2-linux-x86_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Windows libsql
        if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
        run: curl -OL https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip && sudo unzip -o sqlite-dll-win-x64-3460100.zip -d winlibs && sudo chown -R runner:docker winlibs/ && pwd && ls -lah && cd winlibs && x86_64-w64-mingw32-dlltool -d sqlite3.def -l libsqlite3.a && ls -lah && cd ..

      - name: Build project
        run: |
          cargo build --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/dash-evo-tool${{ matrix.ext }} dash-evo-tool/dash-evo-tool${{ matrix.ext }}
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CFLAGS_x86_64_pc_windows_gnu: "-O2"

      - name: Package release
        run: |
          zip -r dash-evo-tool-${{ matrix.platform }}.zip dash-evo-tool/

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dash-evo-tool-${{ matrix.platform }}.zip'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-${{ matrix.platform }}.zip
          path: dash-evo-tool-${{ matrix.platform }}.zip

  build-macos-universal:
    name: Build macOS Universal Binary (Signed & Notarized)
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install protoc
        run: |
          brew install protobuf
          protoc --version

      - name: Build both architectures and create universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p build
          lipo -create \
            -output build/dash-evo-tool \
            target/aarch64-apple-darwin/release/dash-evo-tool \
            target/x86_64-apple-darwin/release/dash-evo-tool
          chmod +x build/dash-evo-tool
          
          # Create app bundle structure
          mkdir -p "build/Dash Evo Tool.app/Contents/MacOS"
          mkdir -p "build/Dash Evo Tool.app/Contents/Resources"
          
          # Move binary into app bundle
          cp build/dash-evo-tool "build/Dash Evo Tool.app/Contents/MacOS/dash-evo-tool"
          
          # Create icon set and convert to ICNS with proper padding for rounded corners
          mkdir -p AppIcon.iconset
          
          # Add 10% padding to the icon for proper macOS appearance
          # This ensures the icon doesn't fill the entire square and leaves room for rounded corners
          sips -z 14 14     assets/DET_LOGO.png --out temp_16.png
          sips -p 16 16     temp_16.png --out AppIcon.iconset/icon_16x16.png
          sips -z 29 29     assets/DET_LOGO.png --out temp_32.png  
          sips -p 32 32     temp_32.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -p 32 32     temp_32.png --out AppIcon.iconset/icon_32x32.png
          sips -z 58 58     assets/DET_LOGO.png --out temp_64.png
          sips -p 64 64     temp_64.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 115 115   assets/DET_LOGO.png --out temp_128.png
          sips -p 128 128   temp_128.png --out AppIcon.iconset/icon_128x128.png
          sips -z 230 230   assets/DET_LOGO.png --out temp_256.png
          sips -p 256 256   temp_256.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -p 256 256   temp_256.png --out AppIcon.iconset/icon_256x256.png
          sips -z 460 460   assets/DET_LOGO.png --out temp_512.png
          sips -p 512 512   temp_512.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -p 512 512   temp_512.png --out AppIcon.iconset/icon_512x512.png
          sips -z 920 920   assets/DET_LOGO.png --out temp_1024.png
          sips -p 1024 1024 temp_1024.png --out AppIcon.iconset/icon_512x512@2x.png
          rm temp_*.png
          iconutil -c icns AppIcon.iconset
          cp AppIcon.icns "build/Dash Evo Tool.app/Contents/Resources/AppIcon.icns"
          
          # Create Info.plist
          cat > "build/Dash Evo Tool.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>dash-evo-tool</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>org.dash.evo-tool</string>
            <key>CFBundleName</key>
            <string>Dash Evo Tool</string>
            <key>CFBundleDisplayName</key>
            <string>Dash Evo Tool</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Import signing certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve signing identity
        id: signid
        run: |
          ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | sed -E 's/.*"(.+)"/\1/' | head -n1)
          echo "IDENTITY=$ID" >> "$GITHUB_OUTPUT"

      - name: Code sign app bundle with hardened runtime and timestamp
        run: |
          # Create entitlements file
          cat > entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Sign the app bundle (deep signing to get all components)
          codesign --force --deep --options runtime --timestamp \
            --sign "${{ steps.signid.outputs.IDENTITY }}" \
            --entitlements entitlements.plist \
            "build/Dash Evo Tool.app"
          
          # Verify the signature
          codesign --verify --deep --strict --verbose=2 "build/Dash Evo Tool.app"

      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -r "build/Dash Evo Tool.app" dmg-content/

          # Create a simple Applications symlink
          ln -s /Applications dmg-content/Applications

          # Create DMG
          hdiutil create -volname "Dash Evo Tool" \
            -srcfolder dmg-content \
            -ov -format UDZO \
            dash-evo-tool-macos-universal.dmg

          # Sign the DMG
          codesign --force --sign "${{ steps.signid.outputs.IDENTITY }}" dash-evo-tool-macos-universal.dmg

      - name: Validate Apple credentials
        run: |
          if [ -z "${{ secrets.APPLE_ID }}" ]; then
            echo "Error: APPLE_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "Error: APPLE_TEAM_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]; then
            echo "Error: APPLE_APP_SPECIFIC_PASSWORD secret is not set"
            exit 1
          fi
          echo "Apple credentials validation passed"

      - name: Notarize DMG
        run: |
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit dash-evo-tool-macos-universal.dmg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait --verbose

          echo "Stapling notarization ticket..."
          xcrun stapler staple dash-evo-tool-macos-universal.dmg

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dash-evo-tool-macos-universal.dmg'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-macos-universal.dmg
          path: dash-evo-tool-macos-universal.dmg

  release:
    name: Create GitHub Release
    needs: [build-and-release, build-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux AMD64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-x86_64-linux.zip
      - name: Download Linux Arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-arm64-linux.zip
      - name: Download macOS Universal Artifact
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-macos-universal.dmg
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            ./dash-evo-tool-x86_64-linux.zip
            ./dash-evo-tool-arm64-linux.zip
            ./dash-evo-tool-macos-universal.dmg
            ./dash-evo-tool-windows.zip
          draft: false
          prerelease: true