name: Release Dash Evo Tool

on:
  push:
    tags:
      - 'v*'
      - 'v*-dev.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Version (i.e. v0.1.0)"
        required: true

permissions:
  id-token: write
  attestations: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "1.92"

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────
  build-linux-x86:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-x86-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: linux-x86-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake \
            libsqlite3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-x86_64.zip

      - name: Build Tauri app (release)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/ 2>/dev/null || true

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-artifacts/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-linux-x86_64
          path: release-artifacts/*
          retention-days: 30

  # ── Linux ARM64 ───────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: linux-arm64-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake \
            libsqlite3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-aarch_64.zip
          sudo unzip -o protoc-25.2-linux-aarch_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-aarch_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-aarch_64.zip

      - name: Build Tauri app (release)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/ 2>/dev/null || true

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-artifacts/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-linux-arm64
          path: release-artifacts/*
          retention-days: 30

  # ── macOS ARM64 (Signed & Notarized) ─────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64 (Signed & Notarized)
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - name: Install protoc
        run: |
          brew install protobuf
          protoc --version

      - name: Import signing certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app (release)
        run: npx tauri build --target aarch64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz release-artifacts/ 2>/dev/null || true

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-artifacts/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-macos-arm64
          path: release-artifacts/*
          retention-days: 30

  # ── macOS x86_64 (Signed & Notarized) ────────────────────────────
  build-macos-x86:
    name: Build macOS x86_64 (Signed & Notarized)
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin

      - name: Install protoc
        run: |
          brew install protobuf
          protoc --version

      - name: Import signing certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app (release)
        run: npx tauri build --target x86_64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz release-artifacts/ 2>/dev/null || true

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-artifacts/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-macos-x86_64
          path: release-artifacts/*
          retention-days: 30

  # ── Windows x86_64 (cross-compiled from Linux) ───────────────────
  build-windows:
    name: Build Windows x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: windows-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake \
            gcc-mingw-w64 mingw-w64 mingw-w64-x86-64-dev

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-x86_64.zip

      - name: Prepare Windows SQLite
        run: |
          curl -OL https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip
          sudo unzip -o sqlite-dll-win-x64-3460100.zip -d winlibs
          sudo chown -R runner:docker winlibs/
          cd winlibs && x86_64-w64-mingw32-dlltool -d sqlite3.def -l libsqlite3.a

      - name: Build frontend
        run: npm run build

      - name: Build Rust backend for Windows
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CFLAGS_x86_64_pc_windows_gnu: "-O2"

      - name: Package Windows release
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/x86_64-pc-windows-gnu/release/dash-evo-tool-tauri.exe release-artifacts/dash-evo-tool.exe 2>/dev/null || true
          cd release-artifacts && zip -r ../dash-evo-tool-windows-x86_64.zip .

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dash-evo-tool-windows-x86_64.zip'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash-evo-tool-windows-x86_64
          path: dash-evo-tool-windows-x86_64.zip
          retention-days: 30

  # ── Create GitHub Release ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux-x86, build-linux-arm64, build-macos-arm64, build-macos-x86, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-linux-x86_64
          path: artifacts/linux-x86_64/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-linux-arm64
          path: artifacts/linux-arm64/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-macos-arm64
          path: artifacts/macos-arm64/

      - name: Download macOS x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-macos-x86_64
          path: artifacts/macos-x86_64/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dash-evo-tool-windows-x86_64
          path: artifacts/windows/

      - name: Publish release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/linux-x86_64/*
            artifacts/linux-arm64/*
            artifacts/macos-arm64/*
            artifacts/macos-x86_64/*
            artifacts/windows/*
          draft: false
          prerelease: true
