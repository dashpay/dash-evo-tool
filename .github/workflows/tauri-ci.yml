name: Tauri CI

on:
  push:
    branches:
      - react-native
  pull_request:
    branches:
      - react-native
      - master

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "1.92"

jobs:
  # ── Frontend checks (fast, no Rust needed) ──────────────────────────
  frontend:
    name: Frontend (lint, typecheck, tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Component tests
        run: npm run test

  # ── Playwright E2E (frontend-only, no Tauri) ────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium)
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Playwright integration tests (mock IPC, no Tauri backend) ───────
  test-integration:
    name: Playwright Integration (mock IPC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:e2e-integration

      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: integration-report
          path: playwright-report/
          retention-days: 14

      - name: Upload integration screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-screenshots
          path: test-results/
          retention-days: 7

  # ── Rust checks for src-tauri/ ──────────────────────────────────────
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo docker system prune --all --force || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --all-features

  # ── Tauri build verification (ensures full app compiles) ────────────
  tauri-build:
    name: Tauri build (ubuntu)
    runs-on: ubuntu-latest
    needs: [frontend, rust]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo docker system prune --all --force || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-build-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-build-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Tauri app (debug)
        run: |
          set -o pipefail
          npx tauri build --debug 2>&1 | tail -20

  # ── Tauri build verification (macOS) ───────────────────────────────
  tauri-build-macos:
    name: Tauri build (macOS)
    runs-on: macos-latest
    needs: [frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install protoc
        run: brew install protobuf

      - name: Build Tauri app (debug)
        run: |
          set -o pipefail
          npx tauri build --debug 2>&1 | tail -20

  # ── Full E2E tests (real Tauri backend, WebdriverIO + tauri-driver) ─
  test-e2e-full:
    name: Full E2E (WebdriverIO)
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo docker system prune --all --force || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-e2e-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-e2e-
            ${{ runner.os }}-cargo-tauri-build-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb dbus-x11 unzip

      - name: Install protoc
        run: |
          PB_ARCH=$(dpkg --print-architecture)
          if [ "$PB_ARCH" = "arm64" ]; then PB_ARCH="aarch_64"; else PB_ARCH="x86_64"; fi
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-${PB_ARCH}.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip
          protoc --version

      - name: Install tauri-driver
        run: cargo install tauri-driver

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache SPV data
        uses: actions/cache@v4
        with:
          path: ~/.config/Dash-Evo-Tool/spv
          key: ${{ runner.os }}-spv-testnet-${{ hashFiles('.env.example') }}
          restore-keys: ${{ runner.os }}-spv-testnet-

      - name: Configure testnet
        run: |
          mkdir -p ~/.config/Dash-Evo-Tool
          cp .env.example ~/.config/Dash-Evo-Tool/.env 2>/dev/null || true

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (debug)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo build 2>&1 | tail -5

      - name: Run WebdriverIO E2E tests
        timeout-minutes: 25
        run: |
          set -o pipefail

          # Start dbus (needed for Playwright Chromium)
          eval "$(dbus-launch --sh-syntax)" 2>/dev/null || true

          # Start Xvfb (virtual display)
          Xvfb :99 -screen 0 1280x800x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 1

          # Start frontend static server (debug builds use devUrl http://localhost:1420)
          PORT=1420 node docker/e2e/static-server.cjs &
          DEV_SERVER_PID=$!
          sleep 1

          # Start tauri-driver
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          # Run WebdriverIO tests
          mkdir -p test-results/e2e-full
          npx wdio tests/e2e-full/wdio.conf.ts 2>&1 | tee test-results/e2e-full/wdio-output.log || TEST_EXIT=$?

          # Cleanup
          kill $DEV_SERVER_PID 2>/dev/null || true
          kill $DRIVER_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true

          exit ${TEST_EXIT:-0}
        env:
          DISPLAY: ":99"
          TAURI_DRIVER_PORT: "4444"
          E2E_WALLET_MNEMONIC: ${{ secrets.E2E_TESTNET_MNEMONIC }}
          E2E_FAUCET_URL: "https://faucet.thepasta.org"

      - name: Upload WebdriverIO report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-full-report
          path: test-results/e2e-full/
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-full-screenshots
          path: test-results/screenshot-*.png
          retention-days: 7
