name: Tests

# Path filters below fire on any change that can affect a build or test result,
# plus the migration fixture tooling. `**/*.rs` includes build.rs; fixture
# documentation changes also exercise the migration gate.
on:
  push:
    branches:
      - "v*-dev"
    paths: &code_paths
      - "**/*.rs" # includes build.rs
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "tests/backend-e2e/**"
      - "tests/migration-fixtures/**"
      - "scripts/migration-fixtures/**"
      - "scripts/ci/**"
      - ".github/workflows/tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *code_paths
  # Allows a manual run against a branch. Draft PRs are suppressed by the
  # `draft != true` guard below and otherwise have no way to run CI at all; a
  # manual run covers them. Note it tests the branch head, not the PR merge
  # commit, so it does not prove the merged result is green.
  workflow_dispatch:
  # The pin guard and fixture coverage can change without a commit here.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pin-ancestry:
    name: Platform pin guard
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check fixture scripts
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/migration-fixtures/test-scripts.sh
          bash scripts/ci/test-run-tests.sh

      # Fetches only the upstream commit graph plus the pinned rev's migration
      # sources — seconds, not a full platform clone. See the script header for
      # why ancestry alone is not sufficient.
      - name: Check platform pin ancestry and migration fingerprint
        run: scripts/migration-fixtures/check-pin-ancestry.sh

  test:
    name: Test Suite
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Download fixture artifacts from earlier workflow runs.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # No `toolchain` input: the action installs what rust-toolchain.toml pins,
      # so this job runs the same compiler the project builds with. Naming a
      # version here (or setting a rustup override) would take precedence over
      # that file and silently test a different toolchain than the pinned one.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # This action defaults RUSTFLAGS to "-D warnings"; the test job has
          # never denied warnings and Clippy owns that gate, so keep it unset.
          rustflags: ""
          # Cargo caching is handled by the actions/cache step above.
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libsqlite3-dev zstd

      - name: Install protoc
        run: |
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-25.2-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-25.2-linux-x86_64.zip
        env:
          PROTOC: /usr/local/bin/protoc

      - name: Build all test targets and det-cli once
        run: cargo test --locked --all-features --workspace --no-run

      # A failed download must fail the migration suite, but still let the
      # ordinary suite report its result against the shared build.
      - name: Download migration fixtures
        id: fixtures
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/migration-fixtures"
          mkdir -p "$dest"
          scripts/migration-fixtures/download-fixtures.sh --strict --dest "$dest"
          count="$(find "$dest" -maxdepth 1 \( -name '*.tar.zst' -o -name '*.tar.gz' \) | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No migration fixture archives were downloaded."
            exit 1
          fi
          echo "Resolved $count fixture archive(s)."
          echo "dir=$dest" >>"$GITHUB_OUTPUT"

      - name: Run tests and migration matrix in parallel
        env:
          MIGRATION_FIXTURES_DIR: ${{ steps.fixtures.outputs.dir }}
          MIGRATION_FIXTURES_MANIFEST: ${{ github.workspace }}/tests/migration-fixtures/manifest.json
          MIGRATION_V093_WALLET_PASSWORD: ${{ secrets.MIGRATION_V093_WALLET_PASSWORD }}
          MIGRATION_MATRIX_SKIP_PASSWORDS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash scripts/ci/run-tests.sh "$RUNNER_TEMP/test-logs"

  coverage:
    name: Fixture coverage
    # Schedule only: a coverage gap is created by cutting a release, never by
    # editing code, so running this per-PR would fail pull requests for
    # something no contributor did or can fix.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check fixture coverage against published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/migration-fixtures/check-coverage.sh
