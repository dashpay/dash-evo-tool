name: "Weekly Draft Pre-release"

# Cuts a pre-release every Tuesday from v1.0-dev, versioned
# v<core>-weekly.<YYYYMMDD> (core read live from Cargo.toml), skipping when
# there are no new commits since the last weekly tag or when CI is red.
# Posts a Slack notification linking to the release page.
#
# DRAFT vs PUBLISHED: the release is built as a draft either way, and the
# `finalize` job publishes it at the end of a SCHEDULED run once every build
# leg is green, every artifact is attached, and GUI QA is PASS. A `workflow_dispatch` run
# leaves it a draft for the person who asked for it to review. Publishing
# always keeps the prerelease flag, so a weekly never becomes "Latest".
#
# SECURITY NOTE: the `tag` job pushes with the default GITHUB_TOKEN only,
# never a PAT. GitHub suppresses new workflow runs triggered by the default
# token, which is what keeps release.yml's `push: tags: v*` trigger dormant
# for this tag (it matches `v*`). Pushing this tag with a PAT would fire a
# duplicate NON-draft prerelease build. Do not "fix" this by swapping in a PAT.

on:
  schedule:
    - cron: "30 3 * * 2" # Every Tuesday at 03:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Re-cut / update today's draft even if it already exists or no new commits landed"
        type: boolean
        default: false
      version:
        description: "Custom semver to use instead of the auto-derived v<core>-weekly.<date> (optional)"
        type: string
        default: ""

concurrency:
  group: weekly-build
  cancel-in-progress: false # weekly cadence: never interrupt a half-cut release

permissions: {}

jobs:
  gate:
    name: Determine whether to release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      ci_red: ${{ steps.decide.outputs.ci_red }}
      reason: ${{ steps.decide.outputs.reason }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          FORCE: ${{ inputs.force || false }}
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Use completed branch runs: path filters can leave docs-only HEAD unchecked.
          # Gate push suites and scheduled fixture/pin checks independently.
          # Missing history is absent, not red; force/version never bypass red CI.
          # A manual run never stands in for a push suite.
          red=false
          for check in tests.yml:push clippy.yml:push; do
            wf="${check%:*}"
            event="${check#*:}"
            concl=$(gh run list --workflow "$wf" --branch "$REF_NAME" --event "$event" --status completed \
                      --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            case "$concl" in
              failure | cancelled | timed_out | startup_failure) red=true ;;
            esac
          done

          # Scheduled slot. A manual tests.yml run of this branch at exactly this
          # commit decides it when not older (run creation time) than the scheduled
          # run: red blocks, also on a tie; green replaces the scheduled result only
          # when strictly newer and with both scheduled checks passed.
          head_sha=$(git rev-parse HEAD)
          # Prints "<createdAt> <conclusion> <id>" of the newest completed run, or nothing.
          newest_tests_run() {
            gh run list --workflow tests.yml --branch "$REF_NAME" --status completed --limit 1 "$@" \
              --json conclusion,createdAt,databaseId \
              --jq '.[0] | select(. != null) | "\(.createdAt) \(.conclusion) \(.databaseId)"'
          }
          sched=$(newest_tests_run --event schedule)
          manual=$(newest_tests_run --event workflow_dispatch --commit "$head_sha")
          read -r sched_at sched_concl _ <<<"$sched"
          read -r manual_at manual_concl manual_id <<<"$manual"
          # Equal-width UTC timestamps: string order is time order.
          if [ -n "$manual_at" ] && [[ ! "$manual_at" < "$sched_at" ]]; then
            case "$manual_concl" in
              failure | cancelled | timed_out | startup_failure) red=true ;;
              success)
                if [[ "$manual_at" > "$sched_at" ]]; then
                  # A run that skipped either check proves nothing for this slot.
                  passed=$(gh run view "$manual_id" --json jobs --jq '[.jobs[]
                    | select(.conclusion == "success") | .name
                    | select(. == "Fixture coverage" or . == "Platform pin guard")] | unique | length')
                  if [ "$passed" = 2 ]; then sched_concl=success; fi
                fi
                ;;
            esac
          fi
          case "$sched_concl" in
            failure | cancelled | timed_out | startup_failure) red=true ;;
          esac
          if [ "$red" = true ]; then
            {
              echo "should_release=false"
              echo "ci_red=true"
              echo "reason=ci_red"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ci_red=false" >>"$GITHUB_OUTPUT"

          # Version / tag derivation
          if [ -n "$MANUAL_VERSION" ]; then
            # Fail-closed on malformed human input — it flows into `git tag`.
            if ! printf '%s' "$MANUAL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid 'version' input '$MANUAL_VERSION' — must be semver, e.g. 1.0.0-weekly.20260715 or 1.2.0-rc.1"
              exit 1
            fi
            VERSION="$MANUAL_VERSION"
          else
            CORE=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/; s/[-+].*//') # 1.0.0-dev -> 1.0.0
            VERSION="${CORE}-weekly.$(date -u +%Y%m%d)+$(git rev-parse --short=9 HEAD)"
          fi
          TAG="v${VERSION%%+*}" # strip +buildmetadata for the git ref

          # Already-released / no-new-commits — bypassed ONLY by force.
          # A supplied `version` bypasses neither of these gates.
          git fetch --tags --quiet
          if [ "$FORCE" != "true" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              {
                echo "should_release=false"
                echo "reason=already_released"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '[.[] | select((.body // "") | test("<!-- weekly-version:"))] | sort_by(.created_at) | reverse | .[0].tag_name // empty')
            if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null && [ "$(git rev-list --count "${LAST}..HEAD")" -eq 0 ]; then
              {
                echo "should_release=false"
                echo "reason=no_commits"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          {
            echo "should_release=true"
            echo "reason=ok"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >>"$GITHUB_OUTPUT"

  tag:
    name: Push weekly tag
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.gate.outputs.tag }}
      created: ${{ steps.push.outputs.created }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify force-recut ownership
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Only a draft owned by this weekly workflow may be re-cut.
            # Published releases and unrelated tags must never move.
            owned=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true and ((.body // \"\") | test(\"<!-- weekly-version:\"))) | \"true\"" \
              2>/dev/null | head -n1 || echo "")
            if [ "$owned" != "true" ]; then
              echo "::error::Refusing force re-cut: tag $TAG already exists and is not one of this workflow's own draft releases. This would collide with an existing or already-published release — pick a different version."
              exit 1
            fi
            echo "Tag $TAG already exists as our own draft — safe to force re-cut."
          fi

      - name: Push weekly tag
        id: push
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Mark the draft unsafe BEFORE changing the source or any asset.
            gh release view "$TAG" --json body --jq .body -R "$GITHUB_REPOSITORY" > recut-notes.md
            printf '\nDO NOT PUBLISH: re-cut in progress; assets may be inconsistent until a full rebuild and PASS QA.\n' >> recut-notes.md
            gh release edit "$TAG" --title "DO NOT PUBLISH: $TAG (re-cut)" --notes-file recut-notes.md -R "$GITHUB_REPOSITORY"
            echo "Tag $TAG already exists as our own draft — force re-cut: moving it to the current commit."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f -a "$TAG" -m "Weekly draft pre-release $TAG" HEAD
            git push --force origin "refs/tags/$TAG"
            exit 0
          fi
          # Annotated tags need a committer identity; the runner's checkout
          # has none configured by default. Standard github-actions[bot] identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # See the SECURITY NOTE at the top of this file: GITHUB_TOKEN only.
          # Use HEAD, not $GITHUB_SHA: default checkout resolves the triggering
          # ref, so HEAD is the commit this workflow is intentionally building.
          git tag -a "$TAG" -m "Weekly draft pre-release $TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "created=true" >>"$GITHUB_OUTPUT"

  release:
    name: Build platform artifacts
    needs: [gate, tag]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.gate.outputs.tag }}
      draft: true
      version_override: ${{ needs.gate.outputs.version }}

  flatpak:
    name: Build Flatpak artifacts
    needs: [gate, tag]
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit
    # NOTE: flatpak.yml's own `build-flatpak` job hard-codes
    # `permissions: { contents: write }` (needed for its `release:`-event
    # attach-to-release step). GitHub's nested-workflow permission capping is
    # NOT silent truncation — a nested job's own declared permissions must be
    # <= what the caller grants, or the whole workflow fails validation
    # ("Invalid workflow file", startup_failure) before any job runs. So this
    # must be `write` even though the write capability goes unused on this
    # workflow_call path (the attach step only fires on the real `release`
    # event, never on workflow_call).
    permissions:
      contents: write
    with:
      version_override: ${{ needs.gate.outputs.version }}

  # Captures this version's migration fixture with the binary just built and
  # attaches it to the draft, so a release never needs one captured by hand.
  # A failed capture blocks the release: `finalize` is skipped and `cleanup`
  # removes the tag and the draft, exactly as for a failed build.
  fixture:
    name: Capture migration fixture
    needs: [gate, release]
    uses: ./.github/workflows/migration-fixture-capture.yml
    # The most any job of that workflow declares; a nested job asking for more
    # than its caller grants fails the whole run at startup. Its `capture` job,
    # the only one that runs the binaries, holds read access and gets no secret.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.gate.outputs.tag }}
      binary_artifact: dash-evo-tool-linux-x86_64.zip
      # The fixture's users trust captures of v1.0-dev only (`TRUSTED_REF` in
      # download-fixtures.sh). A cut from any other ref is captured as a dry
      # run: attaching a fixture they would reject fails every Tests run once
      # that release is published.
      attach: ${{ github.ref == 'refs/heads/v1.0-dev' }}

  qa:
    name: Review release GUI
    needs: [gate, seal]
    uses: ./.github/workflows/release-qa.yml
    permissions:
      contents: write
      actions: read
      attestations: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
    with:
      tag: ${{ needs.gate.outputs.tag }}
      binary_artifact: dash-evo-tool-linux-x86_64.zip

  seal:
    name: Seal draft before GUI QA
    needs: [gate, release, flatpak, fixture]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "dash-evo-tool-linux-*-flatpak"
          merge-multiple: true
          path: fp

      - name: Upload Flatpak bundles and fetch release URL
        id: upload
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          printf '<!-- weekly-version: %s -->\nDO NOT PUBLISH: GUI QA is pending or incomplete. Inspect the workflow before publication.\n' "$VERSION" > pending-notes.md
          gh release edit "$TAG" --title "DO NOT PUBLISH: $TAG (QA pending)" --notes-file pending-notes.md -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" fp/*.flatpak --clobber -R "$GITHUB_REPOSITORY"
          url=$(gh release view "$TAG" --json url --jq .url -R "$GITHUB_REPOSITORY")
          echo "url=$url" >>"$GITHUB_OUTPUT"

  finalize:
    name: Record QA verdict and publish eligible weekly
    needs: [gate, seal, qa]
    if: always() && !cancelled() && needs.seal.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      url: ${{ needs.seal.outputs.url }}
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Record QA outcome on retained draft
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          QA_VERDICT: ${{ needs.qa.outputs.verdict }}
          QA_RESULT: ${{ needs.qa.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title="DO NOT PUBLISH: $TAG"
          note="DO NOT PUBLISH: GUI QA ${QA_VERDICT:-INCOMPLETE}; review the report and rerun QA."
          if [ "$QA_RESULT" = success ] && [ "$QA_VERDICT" = PASS ]; then
            title="$TAG"
            note="GUI QA: PASS."
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              note="$note Manual runs remain drafts for human publication."
            fi
          fi
          printf '<!-- weekly-version: %s -->\n%s\n' "$VERSION" "$note" > qa-notes.md
          gh release edit "$TAG" --title "$title" --notes-file qa-notes.md -R "$GITHUB_REPOSITORY"

      # Publish only a complete scheduled cut with PASS GUI QA.
      # An unavailable report, timeout, NOTE or FAIL leaves an unpublished draft.
      #
      # Scheduled runs only. A `workflow_dispatch` cut stays a draft: someone
      # asked for that run by hand, usually to inspect or re-cut something,
      # and gets to decide when it ships.
      #
      # `--prerelease` is re-asserted rather than assumed. Publishing a
      # release not flagged prerelease would make it the repository's "Latest"
      # and hand weekly builds to everyone tracking stable; the flag is set at
      # creation, and this keeps a change there from silently promoting a
      # weekly.
      # Publishing failures also retain the draft; notify reports the outcome.
      - name: Publish the weekly pre-release
        id: publish
        if: github.event_name == 'schedule' && needs.qa.result == 'success' && needs.qa.outputs.verdict == 'PASS'
        continue-on-error: true
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease -R "$GITHUB_REPOSITORY"
          echo "published=true" >>"$GITHUB_OUTPUT"
          echo "Published $TAG as a pre-release."

  # Build/fixture failures only. QA and finalize problems retain the draft.
  cleanup:
    name: Clean up orphaned tag on build failure
    needs: [gate, tag, release, flatpak, fixture]
    if: always() && needs.gate.outputs.should_release == 'true' && needs.tag.result == 'success' && needs.tag.outputs.created == 'true' && (needs.release.result != 'success' || needs.flatpak.result != 'success' || needs.fixture.result != 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Delete orphaned weekly tag
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY"
          else
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi

  notify:
    name: Slack notification
    needs: [gate, tag, release, flatpak, fixture, seal, qa, finalize, cleanup]
    if: always() && (needs.gate.outputs.should_release == 'true' || needs.gate.outputs.ci_red == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Post Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          SHOULD_RELEASE: ${{ needs.gate.outputs.should_release }}
          CI_RED: ${{ needs.gate.outputs.ci_red }}
          VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_URL: ${{ needs.finalize.outputs.url }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          PUBLISHED: ${{ needs.finalize.outputs.published }}
          RELEASE_RESULT: ${{ needs.release.result }}
          FLATPAK_RESULT: ${{ needs.flatpak.result }}
          FIXTURE_RESULT: ${{ needs.fixture.result }}
          TAG_RESULT: ${{ needs.tag.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          QA_VERDICT: ${{ needs.qa.outputs.verdict }}
          QA_URL: ${{ needs.qa.outputs.artifact_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_CI_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$CI_RED" = "true" ]; then
            TEXT=":warning: *I, Claudius the Magnificent, decline to bless a broken week.* CI on \`${GITHUB_REF_NAME}\` is red — no weekly draft was cut. Mend the pipeline: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$FINALIZE_RESULT" = "success" ] && [ "${PUBLISHED:-}" = "true" ]; then
            TEXT=":sparkles: *I, Claudius the Magnificent, have published another weekly for \`${REPO}\`.* Version \`${VERSION}\` is live as a pre-release, no assent required: <${RELEASE_URL}|the release page>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$FINALIZE_RESULT" = "success" ]; then
            TEXT=":sparkles: *I, Claudius the Magnificent, have sealed another weekly draft for \`${REPO}\`.* Version \`${VERSION}\` remains unpublished — inspect its QA status here: <${RELEASE_URL}|the release page>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$RELEASE_RESULT" = "success" ] && [ "$FLATPAK_RESULT" = "success" ] && [ "$FIXTURE_RESULT" = "success" ]; then
            TEXT=":warning: Weekly build artifacts are ready; finalization did not complete. The draft is retained: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$FLATPAK_RESULT" = "success" ] && [ "$FIXTURE_RESULT" = "failure" ] && [ "$CLEANUP_RESULT" = "success" ]; then
            TEXT=":rotating_light: *Even I, Claudius the Magnificent, will not publish a release whose upgrade I could not prove.* Version \`${VERSION}\` for \`${REPO}\` was built, yet its migration fixture could not be captured — I have swept the tag and the draft away. Mend it, then cut the week again: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$FLATPAK_RESULT" = "success" ] && [ "$FIXTURE_RESULT" = "failure" ]; then
            TEXT=":rotating_light: *Even I, Claudius the Magnificent, will not publish a release whose upgrade I could not prove, and I could not clean up after myself either.* Version \`${VERSION}\` for \`${REPO}\` was built, yet its migration fixture could not be captured, and automatic cleanup did not finish — a stray tag or draft release may remain. Manual sweep required: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$TAG_RESULT" = "success" ] && [ "$CLEANUP_RESULT" = "success" ]; then
            TEXT=":rotating_light: *Even I, Claudius the Magnificent, cannot forge a release from a broken build.* Version \`${VERSION}\` for \`${REPO}\` was tagged, yet the platform build faltered — I have swept the orphaned tag away so next week begins unblemished. Inspect the wreckage: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ] && [ "$TAG_RESULT" = "success" ]; then
            TEXT=":rotating_light: *Even I, Claudius the Magnificent, cannot forge a release from a broken build, and I could not clean up after myself either.* Version \`${VERSION}\` for \`${REPO}\` was tagged, the platform build faltered, and automatic cleanup did not finish — a stray tag or draft release may remain. Manual sweep required: <${RUN_URL}|the run>."
          elif [ "$SHOULD_RELEASE" = "true" ]; then
            TEXT=":rotating_light: *Even I, Claudius the Magnificent, could not even lay down this week's tag.* Something broke for \`${REPO}\` before any build began. Inspect: <${RUN_URL}|the run>."
          else
            echo "Nothing to notify."
            exit 0
          fi

          if [ "$SHOULD_RELEASE" = "true" ] && [ -n "${QA_VERDICT:-}" ] && [ "$CLEANUP_RESULT" != success ]; then
            TEXT="$TEXT GUI QA: $QA_VERDICT. <${QA_URL:-$RUN_URL}|Report, gallery and logs>."
            if [ "${EVENT_NAME:-}" = workflow_dispatch ]; then
              TEXT="$TEXT Manual runs remain drafts, including PASS."
            else
              TEXT="$TEXT Scheduled runs publish only on PASS."
            fi
          fi

          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"

          echo "Slack notification sent."
