[package]
name = "dash-evo-tool"
version = "1.0.0-dev"
license = "MIT"
edition = "2024"
default-run = "dash-evo-tool"
rust-version = "1.92"

[dependencies]
tokio-util = { version = "0.7.15" }
bip39 = { version = "2.2.0", features = ["all-languages", "rand"] }
derive_more = "2.1.1"
egui = "0.33.3"
egui_extras = "0.33.3"
egui_commonmark = "0.22.0"
rfd = "0.17.2"
qrcode = "0.14.1"
nix = { version = "0.31.1", features = ["signal"] }
eframe = { version = "0.33.3", features = ["persistence", "wgpu"] }
base64 = "0.22.1"
dash-sdk = { git = "https://github.com/dashpay/platform", rev = "51346ccac7a955d1ea48f061ad2e12a42d3c8c37", features = [
    "core_key_wallet",
    "core_key_wallet_manager",
    "core_bincode",
    "core_quorum-validation",
    "core_verification",
    "core_rpc_client",
    "core_spv",
    "shielded",
] }
rs-sdk-trusted-context-provider = { git = "https://github.com/dashpay/platform", rev = "51346ccac7a955d1ea48f061ad2e12a42d3c8c37" }
zip32 = "0.2.0"
grovestark = { git = "https://www.github.com/dashpay/grovestark", rev = "5b9e289cca54c79b1305d5f4f40bf1148f1eb0e3" }
rayon = "1.8"
thiserror = "2.0.18"
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml_ng = { version = "0.10.0" }
tokio = { version = "1.46.1", features = ["full"] }
bincode = { version = "=2.0.1", features = ["serde"] }
hex = { version = "0.4.3" }
itertools = "0.14.0"
enum-iterator = "2.1.0"
futures = "0.3.31"
tracing = "0.1.41"
rand = "0.9"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dotenvy = "0.15.7"
envy = "0.4.2"
chrono = "0.4.41"
chrono-humanize = "0.2.3"
sha2 = "0.10.9"
ed25519-dalek = "2.1"
arboard = { version = "3.6.0", default-features = false, features = [
    "windows-sys",
] }
directories = "6.0.0"
rusqlite = { version = "0.38.0", features = ["bundled", "functions", "fallible_uint"] }
dark-light = "2.0.0"
image = { version = "0.25.6", default-features = false, features = [
    "png",
    "jpeg",
] }
resvg = "0.46"
reqwest = { version = "0.13", features = ["json", "stream"] }
bitflags = "2.10"
rust-embed = "8.7.2"
zeroize = "1.8.1"
zxcvbn = "3.1.0"
argon2 = "0.5.3" # For Argon2 key derivation
aes-gcm = "0.10.3" # For AES-256-GCM encryption
cbc = "0.1.2" # For CBC mode encryption
crossbeam-channel = "0.5.15"
regex = "1.11.1"
humantime = "2.2.0"
which = { version = "8.0.0" }
tz-rs = { version = "0.7.0" }
tempfile = "3.20.0"
arc-swap = "1"
urlencoding = "2"
region = "3.0.2"
rmcp = { version = "1.2", optional = true, default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
subtle = { version = "2.6", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
zmq = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
zeromq = "0.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
native-dialog = "0.9.0"
raw-cpuid = "11.5.0"

[features]
testing = []
mcp = ["dep:rmcp", "rmcp/server", "rmcp/macros", "rmcp/transport-streamable-http-server", "dep:axum", "dep:subtle"]
cli = ["dep:rmcp", "rmcp/server", "rmcp/macros", "rmcp/client", "rmcp/transport-io", "rmcp/transport-streamable-http-client-reqwest", "dep:clap", "dep:clap_complete"]
headless = ["cli", "mcp"]

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["eframe"] }
tokio-shared-rt = "=0.1.0"

[[bin]]
name = "det-cli"
path = "src/bin/det_cli/main.rs"
required-features = ["cli"]

[build-dependencies]
winres = "0.1"

# Keep full debuginfo for our code, but only line tables for dependencies.
# This shrinks DWARF from ~790MB to a fraction, letting gimli (std's backtrace
# symbolizer) actually resolve panic backtraces instead of printing <unknown>.
[profile.dev.package."*"]
debug = "line-tables-only"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(tokio_unstable)", "cfg(feature, values(\"testing\", \"mcp\", \"cli\", \"headless\"))"]


[lints.clippy]
uninlined_format_args = "allow"

