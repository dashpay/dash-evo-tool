[package]
name = "dash-evo-tool"
version = "1.0.0-dev"
license = "MIT"
edition = "2024"
default-run = "dash-evo-tool"
rust-version = "1.92"

[dependencies]
tokio-util = { version = "0.7.15" }
bip39 = { version = "2.2.0", features = ["all-languages", "rand"] }
derive_more = "2.1.1"
egui = "0.33.3"
egui_extras = "0.33.3"
egui_commonmark = "0.22.0"
rfd = "0.17.2"
qrcode = "0.14.1"
nix = { version = "0.31.1", features = ["signal"] }
eframe = { version = "0.33.3", features = ["persistence"] }
base64 = "0.22.1"
dash-sdk = { git = "https://github.com/dashpay/platform", branch = "feat/zk", features = [
    "core_key_wallet",
    "core_key_wallet_manager",
    "core_bincode",
    "core_quorum-validation",
    "core_verification",
    "core_rpc_client",
    "core_spv",
    "shielded",
] }
zip32 = "0.2.0"
grovestark = { git = "https://www.github.com/dashpay/grovestark", rev = "5b9e289cca54c79b1305d5f4f40bf1148f1eb0e3" }
rayon = "1.8"
thiserror = "2.0.18"
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml_ng = { version = "0.10.0" }
tokio = { version = "1.46.1", features = ["full"] }
bincode = { version = "=2.0.1", features = ["serde"] }
hex = { version = "0.4.3" }
itertools = "0.14.0"
enum-iterator = "2.1.0"
futures = "0.3.31"
tracing = "0.1.41"
rand = "0.9"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dotenvy = "0.15.7"
envy = "0.4.2"
chrono = "0.4.41"
chrono-humanize = "0.2.3"
sha2 = "0.10.9"
ed25519-dalek = "2.1"
arboard = { version = "3.6.0", default-features = false, features = [
    "windows-sys",
] }
directories = "6.0.0"
rusqlite = { version = "0.38.0", features = ["functions", "fallible_uint"] }
dark-light = "2.0.0"
image = { version = "0.25.6", default-features = false, features = [
    "png",
    "jpeg",
] }
resvg = "0.46"
reqwest = { version = "0.13", features = ["json", "stream"] }
bitflags = "2.10"
rust-embed = "8.7.2"
zeroize = "1.8.1"
zxcvbn = "3.1.0"
argon2 = "0.5.3" # For Argon2 key derivation
aes-gcm = "0.10.3" # For AES-256-GCM encryption
cbc = "0.1.2" # For CBC mode encryption
crossbeam-channel = "0.5.15"
regex = "1.11.1"
humantime = "2.2.0"
which = { version = "8.0.0" }
tz-rs = { version = "0.7.0" }
tempfile = "3.20.0"
arc-swap = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
zmq = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
zeromq = "0.4.1"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
native-dialog = "0.9.0"
raw-cpuid = "11.5.0"

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["eframe"] }

[build-dependencies]
winres = "0.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(tokio_unstable)"]

[patch."https://github.com/dashpay/platform"]
dapi-grpc = { path = "../platform/packages/dapi-grpc" }
dash-context-provider = { path = "../platform/packages/rs-context-provider" }
dash-platform-macros = { path = "../platform/packages/rs-dash-platform-macros" }
dash-sdk = { path = "../platform/packages/rs-sdk" }
dashpay-contract = { path = "../platform/packages/dashpay-contract" }
data-contracts = { path = "../platform/packages/data-contracts" }
dpns-contract = { path = "../platform/packages/dpns-contract" }
dpp = { path = "../platform/packages/rs-dpp" }
drive = { path = "../platform/packages/rs-drive" }
drive-proof-verifier = { path = "../platform/packages/rs-drive-proof-verifier" }
feature-flags-contract = { path = "../platform/packages/feature-flags-contract" }
keyword-search-contract = { path = "../platform/packages/keyword-search-contract" }
masternode-reward-shares-contract = { path = "../platform/packages/masternode-reward-shares-contract" }
platform-serialization = { path = "../platform/packages/rs-platform-serialization" }
platform-serialization-derive = { path = "../platform/packages/rs-platform-serialization-derive" }
platform-value = { path = "../platform/packages/rs-platform-value" }
platform-version = { path = "../platform/packages/rs-platform-version" }
platform-versioning = { path = "../platform/packages/rs-platform-versioning" }
rs-dapi-client = { path = "../platform/packages/rs-dapi-client" }
token-history-contract = { path = "../platform/packages/token-history-contract" }
wallet-utils-contract = { path = "../platform/packages/wallet-utils-contract" }
withdrawals-contract = { path = "../platform/packages/withdrawals-contract" }

[lints.clippy]
uninlined_format_args = "allow"
