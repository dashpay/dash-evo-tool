<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Rename Wallet Dialog — Dash Evo Tool Mockup</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal.modal-sm { max-width: 440px; }
  </style>
</head>
<body>

<div class="app-frame" style="position: relative;">

  <!-- ===== Top Panel ===== -->
  <header class="top-panel">
    <span class="app-name">Dash Evo Tool</span>
    <div class="spacer"></div>
    <div class="wallet-selector">
      <span class="wallet-badge badge-hd">HD</span>
      <span class="wallet-name">My Dash Wallet</span>
      <span class="wallet-balance">1.2345 DASH</span>
      <span class="chevron">&#9662;</span>
    </div>
    <span class="network-badge network-mainnet">Mainnet</span>
  </header>

  <!-- ===== Main Content ===== -->
  <div class="main-content">

    <!-- ===== Left Panel (Navigation) ===== -->
    <nav class="left-panel" aria-label="Main navigation">
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8226;</span>
        <span>DashPay</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8226;</span>
        <span>Identities</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8226;</span>
        <span>Contracts</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8226;</span>
        <span>Tokens</span>
      </a>
      <div class="nav-separator"></div>
      <a class="nav-item active" href="#">
        <span class="nav-icon">&#8226;</span>
        <span>Wallets</span>
      </a>
      <div class="nav-separator"></div>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8211;</span>
        <span>Tools</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#8211;</span>
        <span>Settings</span>
      </a>
    </nav>

    <!-- ===== Content Area (dimmed background) ===== -->
    <main class="content-area" style="opacity: 0.3; pointer-events: none;">

      <div class="wallet-title">
        <h2>My Dash Wallet</h2>
      </div>

      <div class="balance-header">
        <div class="balance-amount">
          1.2345<span class="currency">DASH</span>
        </div>
        <div class="balance-label">Total Balance</div>
      </div>

    </main>

  </div><!-- /main-content -->

  <!-- ===== Modal Overlay ===== -->
  <div class="modal-overlay" style="position: absolute; border-radius: var(--radius-xl);">
    <div class="modal modal-sm">

      <div class="modal-header">
        <span class="modal-title">Rename Wallet</span>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <span class="form-label">Current name:</span>
          <span class="text-muted">My Dash Wallet</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-name">New name:</label>
          <input type="text" id="new-name" class="form-input" value="My Main Wallet">
          <span class="form-hint">0&ndash;64 characters</span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-primary">Save</button>
      </div>

    </div>
  </div>

</div><!-- /app-frame -->

<!-- Footer -->
<footer style="text-align: center; margin-top: 24px;">
  <p class="text-xs text-muted">Dash Evo Tool &mdash; Wallet Screen Redesign Mockup</p>
</footer>

</body>
</html>
