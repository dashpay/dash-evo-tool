# Flatpak manifest for Dash Evo Tool
# Build with: flatpak-builder --user --force-clean --repo=flatpak-repo build-dir flatpak/org.dash.DashEvoTool.yml
# Install locally: flatpak-builder --user --install --force-clean build-dir flatpak/org.dash.DashEvoTool.yml
# Create bundle: flatpak build-bundle flatpak-repo dash-evo-tool.flatpak org.dash.DashEvoTool

app-id: org.dash.DashEvoTool
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22

command: dash-evo-tool

finish-args:
  # X11 shared memory for display
  - --share=ipc
  # Network access for blockchain communication
  - --share=network
  # Display server support (prefer Wayland, fall back to X11)
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for egui rendering
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/llvm22/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/dash-evo-tool/cargo
    PROTOC: /app/bin/protoc
    PROTOC_INCLUDE: /app/include

modules:
  # Module 1: Install protobuf compiler (required for building dash-sdk)
  - name: protoc
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        dest-filename: protoc.zip
        url: https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-x86_64.zip
        sha256: 78ab9c3288919bdaa6cfcec6127a04813cf8a0ce406afa625e48e816abee2878
      - type: file
        only-arches:
          - aarch64
        dest-filename: protoc.zip
        url: https://github.com/protocolbuffers/protobuf/releases/download/v25.2/protoc-25.2-linux-aarch_64.zip
        sha256: 07683afc764e4efa3fa969d5f049fbc2bdfc6b4e7786a0b233413ac0d8753f6b
    build-commands:
      - unzip protoc.zip bin/protoc -d /app
      - unzip protoc.zip 'include/*' -d /app
      - chmod 755 /app/bin/protoc

  # Module 2: Build libsodium (required for crypto operations)
  - name: libsodium
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
        sha256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19

  # Module 3: Build dash-evo-tool from source
  #
  # Rust comes from rustup, not the SDK's rust-stable extension, so the
  # toolchain is the one rust-toolchain.toml names, as in every other build.
  # The extension trails Rust releases and would block a toolchain bump.
  - name: dash-evo-tool
    buildsystem: simple
    build-options:
      prepend-path: /run/build/dash-evo-tool/cargo/bin
      env:
        RUSTUP_HOME: /run/build/dash-evo-tool/rustup
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - build-dir
          - flatpak-repo
          - target
      - type: file
        only-arches:
          - x86_64
        dest-filename: rustup-init
        url: https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
        sha256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
      - type: file
        only-arches:
          - aarch64
        dest-filename: rustup-init
        url: https://static.rust-lang.org/rustup/archive/1.29.2/aarch64-unknown-linux-gnu/rustup-init
        sha256: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
    build-commands:
      - chmod 755 rustup-init
      - ./rustup-init -y --no-modify-path --profile minimal --default-toolchain none
      # With no toolchain argument, rustup installs the one rust-toolchain.toml names.
      - rustup toolchain install --no-self-update
      - cargo build --release --locked
      - install -Dm755 target/release/dash-evo-tool /app/bin/dash-evo-tool
      - install -Dm644 flatpak/org.dash.DashEvoTool.desktop /app/share/applications/org.dash.DashEvoTool.desktop
      - install -Dm644 flatpak/org.dash.DashEvoTool.metainfo.xml /app/share/metainfo/org.dash.DashEvoTool.metainfo.xml
      - install -Dm644 assets/DET_LOGO.png /app/share/icons/hicolor/512x512/apps/org.dash.DashEvoTool.png
