[package]
name = "dash-evo-tool-tauri"
version = "1.0.0-dev"
description = "Dash Evo Tool — Tauri 2.0 desktop application"
authors = ["Dash Core Group"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
