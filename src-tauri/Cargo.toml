[package]
name = "dash-evo-tool-tauri"
version = "1.0.0-dev"
description = "Dash Evo Tool — Tauri 2.0 desktop application"
authors = ["Dash Core Group"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["function", "serde_json"] }
specta-typescript = "0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

# DET backend crate — provides AppContext, Database, BackendTask, etc.
dash-evo-tool = { path = ".." }
# Dash SDK — needed for Network type and other platform types at the IPC boundary.
# Cargo unifies this with the version pulled transitively through dash-evo-tool.
dash-sdk = { git = "https://github.com/dashpay/platform", rev = "bcb41de347", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
directories = "6.0"
hex = "0.4"
rand = "0.8"
bip39 = { version = "2.2.0", features = ["all-languages", "rand"] }
base64 = "0.22"

[lints.clippy]
uninlined_format_args = "allow"
